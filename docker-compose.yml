# Deploy stack: backend gateway (WA + Chromium) + web (Vue static via nginx).
# Host nginx (di server) cukup proxy ke 127.0.0.1:8090 → container web.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: openwa-backend
    restart: unless-stopped
    init: true # reap proses anak Chromium
    env_file:
      - ./backend/.env # berisi OPENROUTER_API_KEY (dibuat saat deploy, gitignored)
    environment:
      PORT: "2785"
      DATA_DIR: /app/data
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    volumes:
      - openwa-data:/app/data # sesi WhatsApp (LocalAuth), api-key, ai-config
    shm_size: "512m" # Chromium butuh /dev/shm cukup
    expose:
      - "2785"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: openwa-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8090:80" # hanya localhost; host nginx yang ekspos publik + TLS

volumes:
  openwa-data:
